# docker-compose.yml describes the containers this project needs.
#   Start them:  docker compose up -d
#   Stop them:   docker compose down
# Values like ${POSTGRES_USER} are read from the .env file in this folder.

services:
  # The database. "db" is its name inside Compose.
  db:
    # The image (recipe) to run: PostgreSQL version 17.
    image: postgres:17
    # A fixed, readable name for the container (shown by `docker ps`).
    container_name: lendsmart-db
    # Settings passed into the container. The postgres image uses these
    # on first start to create the user, password and database.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Port mapping, "Mac port : container port".
    # Postgres listens on 5432 inside the container; we reach it on 5434.
    ports:
      - "${POSTGRES_PORT}:5432"
    # Keep the database files in a named volume, outside the container,
    # so the data survives when the container is stopped or deleted.
    volumes:
      - lendsmart_pgdata:/var/lib/postgresql/data
    # Every 5 seconds, ask Postgres "are you ready?" so Docker can report
    # whether the database is actually healthy, not just started.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # If the container crashes, or the Mac restarts, start it again
    # (unless you stopped it yourself with `docker compose down`/`stop`).
    restart: unless-stopped

  # The API. Built from the Dockerfile in this folder.
  api:
    # "build: ." means: build the image from ./Dockerfile instead of downloading one.
    build: .
    container_name: lendsmart-api
    # Settings for connecting to the database, passed in as environment variables
    # (the image has no .env file). Inside Compose's private network, containers
    # find each other by service name, so the database's host is "db", and its
    # port is Postgres's own 5432, not the 5434 we use from the Mac.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    # Mac port 8000 -> the API's port 8000 inside the container.
    ports:
      - "8000:8000"
    # Don't start the API until the database's healthcheck says it's ready.
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

# Named volumes used above. Docker creates and manages the storage.
volumes:
  lendsmart_pgdata:
